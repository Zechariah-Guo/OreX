# OreX server block from docs/planning/deployment/OreX Deployment Plans.md (5.6),
# adapted for docker: static root is /app/src/static, upstream is the "app" service.
server {
    listen 80 default_server;
    server_name orex.mochizou.works localhost;

    # On the VM, cloudflared connects from 127.0.0.1 and sends CF-Connecting-IP.
    # Locally nothing sends that header, so the client IP falls back to the
    # connecting address.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Serve static files directly, bypassing Gunicorn
    location /static/ {
        alias /app/src/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy everything else to Gunicorn
    location / {
        proxy_pass http://app:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # One trusted hop for the app's ProxyFix (OREX_TRUST_PROXY=1)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /app/src/static;
        internal;
    }
}
