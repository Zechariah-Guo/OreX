<!DOCTYPE html>
<!--
    Offline fallback. The service worker (static/js/sw.js) precaches this file
    and shows it when a page navigation fails (device offline, or the server
    refused or dropped the connection).
    It is a plain static file: no Jinja, no login, no database. CSS is inlined
    (like maintenance.html) so it needs no other cached file besides the logo.
    If this file or the logo changes, bump CACHE_VERSION in sw.js.
-->
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Can't reach OreX</title>
    <link rel="icon" type="image/webp" href="/static/images/logo.webp">
    <script>
        // Match the player's saved theme (same key as base.html).
        (function () {
            var theme = localStorage.getItem('orex-theme') || 'light';
            if (theme === 'system') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --colour-accent: #2ecc71;
            --colour-accent-hover: #27ae60;
            --colour-bg: #f5f2f9;
            --colour-text: #1a1025;
            --colour-text-muted: #6b5f7a;
        }

        html[data-theme="dark"] {
            --colour-bg: #241533;
            --colour-text: #f0ecf5;
            --colour-text-muted: #a89bb8;
        }

        html { font-size: 16px; line-height: 1.6; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--colour-bg);
            color: var(--colour-text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: calc(1.5rem + env(safe-area-inset-top)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
        }

        .offline__logo {
            display: block;
            width: 120px;
            height: 103px;
            margin-bottom: 1.25rem;
        }

        .offline__title {
            font-size: 1.5rem;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .offline__text {
            color: var(--colour-text-muted);
            max-width: 360px;
            margin-bottom: 1.5rem;
        }

        .offline__retry {
            font: inherit;
            font-weight: 600;
            min-height: 44px;
            padding: 0.5rem 1.75rem;
            border: none;
            border-radius: 8px;
            background-color: var(--colour-accent);
            color: #ffffff;
            cursor: pointer;
        }

        .offline__retry:hover { background-color: var(--colour-accent-hover); }
        .offline__retry:focus-visible { outline: 3px solid var(--colour-text); outline-offset: 2px; }
    </style>
</head>
<body>
    <img class="offline__logo" src="/static/images/logo.webp" alt="OreX" width="120" height="120">
    <h1 class="offline__title">OreX can't be reached</h1>
    <p class="offline__text">Check your connection, or the server may be down. OreX needs a connection to load live prices.</p>
    <button type="button" class="offline__retry" id="retry">Retry</button>
    <script>
        // Reload re-requests the page the player was trying to open.
        document.getElementById('retry').addEventListener('click', function () {
            location.reload();
        });
        window.addEventListener('online', function () {
            location.reload();
        });
    </script>
</body>
</html>
