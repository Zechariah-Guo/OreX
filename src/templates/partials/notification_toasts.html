{% for notification in notifications %}
<a href="{{ notification.action_url or '/advancements' }}"
   class="flash flash--{{ notification.category }} flash--toast"
   role="alert"
   data-toast
   data-duration="8000"
   style="text-decoration: none; display: block;">
    <div class="flash__message">{{ notification.message }}</div>
    <div class="flash__progress" aria-hidden="true">
        <span class="flash__progress-fill" data-toast-progress></span>
    </div>
</a>
{% endfor %}
